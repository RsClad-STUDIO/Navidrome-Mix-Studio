name: Temporary merge audit

on:
  push:
    branches:
      - integration/main-reconciliation

permissions:
  contents: read

jobs:
  merge-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report merge conflicts against main
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge-tree --write-tree --name-only origin/main HEAD
          status=$?
          set -e
          echo "merge-tree exit code: $status"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
