name: Temporary merge audit

on:
  push:
    branches:
      - integration/main-reconciliation

permissions:
  contents: write

jobs:
  merge-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create isolated merge preview
        shell: bash
        run: |
          git fetch origin main
          set +e
          merge_output="$(git merge-tree --write-tree --name-only origin/main HEAD)"
          status=$?
          set -e
          printf '%s\n' "$merge_output"
          echo "merge-tree exit code: $status"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          tree_sha="$(printf '%s\n' "$merge_output" | head -n 1)"
          merge_sha="$(printf 'Temporary merge preview of main into PR4 branch\n' | git commit-tree "$tree_sha" -p HEAD -p origin/main)"
          git push origin "$merge_sha:refs/heads/integration/merge-preview"
